# Intel GPU (Iris Xe, Arc, Core Ultra) on Windows, through WSL2.
# WSL2 exposes the Windows GPU driver as /dev/dxg plus the user-mode libraries in
# /usr/lib/wsl; Intel's Level Zero runtime in the image uses both (read-only).
# start.sh selects this automatically when llama.cpp lists a SYCL device.
services:
  qwen:
    # llama.cpp v1.0.0 (b12359) Intel SYCL server, pinned by digest.
    image: ghcr.io/ggml-org/llama.cpp@sha256:4fad818e2ccd0add09b5ede1f51b64ee8c86a9d5fc2c632dab545be3dbea204f
    environment:
      LLAMA_ARG_N_GPU_LAYERS: ${LUMEN_GPU_LAYERS:-999}
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
