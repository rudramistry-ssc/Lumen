[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signspeak-ocr"
version = "0.3.0"
description = "Single-image transcription and summaries through a remote vision model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=11.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signspeak-ocr = "signspeak_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
