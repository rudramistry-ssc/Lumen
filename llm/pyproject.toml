[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signspeak-llm"
version = "0.1.0"
description = "Offline OCR-grounded chat through a local llama.cpp server"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["pillow>=11"]

[tool.setuptools.packages.find]
where = ["src"]
