[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signspeak-ocr"
version = "0.1.0"
description = "Classical, CPU-only OCR and document-structure extraction for SignSpeak"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
]

[project.optional-dependencies]
preprocess = ["opencv-python-headless>=4.10"]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8"]

[project.scripts]
signspeak-ocr = "signspeak_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tesseract: requires a working Tesseract installation with eng and fra",
]
