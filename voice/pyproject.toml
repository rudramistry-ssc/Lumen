[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signspeak-voice"
version = "0.1.0"
description = "Two-step offline SignSpeak voice conversation adapter"
requires-python = ">=3.11"
dependencies = ["signspeak-stt==0.1.0", "signspeak-llm==0.1.0", "signspeak-speech==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
