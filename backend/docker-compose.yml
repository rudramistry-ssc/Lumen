# `docker compose up --build` starts the API plus the OCR service (../ocr).
# For now the OCR service only offers /v1/ocr; TTS, STT and chat come later.

services:
  api:
    build: .
    ports:
      - "8000:8000"                 # the only port the browser/laptop needs
    environment:
      DB_PATH: /data/app.db         # inside the volume, survives restarts
      MEDIA_DIR: /data/media
      AI_BASE_URL: http://ai:8000   # compose service name, NOT localhost
      AI_TIMEOUT_SECONDS: "120"     # OCR + TTS can be slow
      CORS_ORIGINS: "*"
      TTS_ENABLED: "false"          # flip to "true" once the AI service has /v1/tts
      FRONTEND_DIR: /frontend       # static UI, served at /
    volumes:
      - appdata:/data               # sqlite + generated mp3s
      - ../frontend:/frontend:ro    # live UI edits, no rebuild needed
    depends_on:
      - ai
    restart: unless-stopped

  ai:
    build: ../ocr                   # Tesseract + the OCR web wrapper
    expose:
      - "8000"                      # internal only, no host port needed

volumes:
  appdata:
