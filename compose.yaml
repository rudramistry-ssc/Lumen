# Lumen offline demo: same app as the HPC version, with the vision model running
# locally in Docker. Start with ./start.sh (Linux/WSL) or .\start.ps1 (Windows):
# they pick a usable GPU automatically and fall back to the CPU.
#
# This file alone is the CPU setup. GPU setups add one override file
# (compose.gpu-*.yaml); start.sh records the choice in .env (COMPOSE_FILE), so
# plain `docker compose ps|logs|down` keep working afterwards.
name: lumen

services:
  # One-time setup: downloads and verifies pinned model files, then exits.
  # Later runs only re-check the files, without network access.
  models:
    image: lumen-app:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/backend/provision.py"]
    environment:
      LUMEN_MODEL_SIZE: ${LUMEN_MODEL_SIZE:-2B}
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/models
    restart: "no"

  # Qwen3-VL served by llama.cpp (OpenAI-compatible API). Internal only.
  qwen:
    # llama.cpp v1.0.0 (b12359) CPU server, pinned by digest.
    image: ghcr.io/ggml-org/llama.cpp@sha256:e3032ea0712da96dec820c770626385de4322dd06619fb5829256a504bbc9375
    # GPU first; if the GPU server crashes, the script keeps serving on the CPU.
    entrypoint: ["/bin/sh", "/lumen/qwen-entrypoint.sh"]
    command:
      - --model
      - /models/qwen/Qwen3VL-${LUMEN_MODEL_SIZE:-2B}-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/qwen/mmproj-Qwen3VL-${LUMEN_MODEL_SIZE:-2B}-Instruct-Q8_0.gguf
      - --alias
      - lumen-local
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --ctx-size
      - ${LUMEN_CONTEXT:-16384}
      - --parallel
      - "1"
      - --jinja
      - --offline
      - --no-webui
    environment:
      # GPU override files set this to offload every layer.
      LLAMA_ARG_N_GPU_LAYERS: ${LUMEN_GPU_LAYERS:-0}
    volumes:
      - models:/models:ro
      - ./backend/qwen-entrypoint.sh:/lumen/qwen-entrypoint.sh:ro
    depends_on:
      models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    init: true
    restart: unless-stopped

  # FastAPI backend + frontend + local speech (faster-whisper, Kokoro).
  api:
    image: lumen-app:local
    environment:
      SIGNSPEAK_VLM_BASE_URL: http://qwen:8091/v1
      SIGNSPEAK_VLM_MODEL: lumen-local
      SIGNSPEAK_VLM_TIMEOUT_SECONDS: ${LUMEN_TIMEOUT_SECONDS:-900}
    ports:
      # Localhost only: microphone and local speech require a localhost origin.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - models:/models:ro
    depends_on:
      models:
        condition: service_completed_successfully
      qwen:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    init: true
    restart: unless-stopped

volumes:
  models:
